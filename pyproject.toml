[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dota-betting-autopilot"
version = "0.1.0"
description = "Rule-based paper betting autopilot MVP for Dota 2 research."
requires-python = ">=3.11"
dependencies = [
    "catboost>=1.2.7",
    "fastapi>=0.135.3",
    "joblib>=1.4.0",
    "jinja2==3.1.6",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "psycopg[binary]>=3.3.3",
    "PyYAML>=6.0",
    "pytest>=8.0",
    "scikit-learn>=1.5.0",
    "uvicorn>=0.44.0",
    "zstandard>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"app" = ["web/*.html", "templates/*.html"]
"app.config" = ["tournament_allowlist.yaml"]
"app.storage" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"

[[tool.mypy.overrides]]
module = ["catboost", "joblib", "pandas", "sklearn.*"]
ignore_missing_imports = true
